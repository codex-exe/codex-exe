<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 292" width="600" height="292" role="img" aria-label="Krishi Junction">
<title>Krishi Junction</title>
<defs>
<radialGradient id="glow" cx="82%" cy="18%" r="70%"><stop offset="0" stop-color="#a3e635" stop-opacity=".20"/><stop offset="1" stop-color="#a3e635" stop-opacity="0"/></radialGradient>
<clipPath id="card"><rect width="600" height="292" rx="20"/></clipPath>
<linearGradient id="cone" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a3e635" stop-opacity=".5"/><stop offset="1" stop-color="#a3e635" stop-opacity="0"/></linearGradient>
</defs>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
.mono{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}

.ping{animation:ping 1.6s ease-out infinite}
@keyframes ping{0%{opacity:0}25%{opacity:1}70%,100%{opacity:0}}
.dr{animation:dr 6s ease-in-out infinite}
@keyframes dr{0%,100%{transform:translate(-20px,0)}50%{transform:translate(70px,6px)}}
.rot{transform-box:fill-box;transform-origin:center;animation:rot .25s linear infinite}
@keyframes rot{0%,100%{transform:scaleX(1)}50%{transform:scaleX(.25)}}
.up{animation:up 1.2s linear infinite}
@keyframes up{to{stroke-dashoffset:-20}}

@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<g clip-path="url(#card)">
<rect width="600" height="292" fill="#0b1220"/>

<rect width="600" height="292" fill="url(#glow)"/>

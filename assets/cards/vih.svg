<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 292" width="600" height="292" role="img" aria-label="Voice in Head RL">
<title>Voice in Head RL</title>
<defs>
<radialGradient id="glow" cx="82%" cy="18%" r="70%"><stop offset="0" stop-color="#8b7bff" stop-opacity=".20"/><stop offset="1" stop-color="#8b7bff" stop-opacity="0"/></radialGradient>
<clipPath id="card"><rect width="600" height="292" rx="20"/></clipPath>

</defs>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
.mono{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}

.eye{transform-box:fill-box;transform-origin:center;animation:blink 4.5s infinite}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
.ant{animation:ant 1.8s ease-in-out infinite}
@keyframes ant{0%,100%{opacity:.35}50%{opacity:1}}
.trail{animation:trail 1.4s linear infinite}
@keyframes trail{to{stroke-dashoffset:-22}}

@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<g clip-path="url(#card)">
<rect width="600" height="292" fill="#0b1220"/>

<rect width="600" height="292" fill="url(#glow)"/>
<g transform="translate(40,26)"><rect x="10" y="20" width="190" height="58" rx="16" fill="#101a2e" stroke="#8b7bff" stroke-width="2"/><text x="28" y="44" font-size="11.5" fill="#8b7bff" class="mono">ACTOR</text><text x="28" y="64" font-size="15" font-weight="600" fill="#e6edf3">GPT-4 proposes</text><rect x="320" y="20" width="190" height="58" rx="16" fill="#101a2e" stroke="#22d3ee" stroke-width="2"/><text x="338" y="44" font-size="11.5" fill="#22d3ee" class="mono">CRITIC</text><text x="338" y="64" font-size="15" font-weight="600" fill="#e6edf3">Gemini pushes back</text><path id="vp1" d="M200,40 H320" stroke="#22304d" stroke-width="2" fill="none"/><path id="vp2" d="M320,60 H200" stroke="#22304d" stroke-width="2" fill="none"/><circle r="5" fill="#8b7bff"><animateMotion dur="1.8s" repeatCount="indefinite"><mpath href="#vp1"/></animateMotion></circle><circle r="5" fill="#22d3ee"><animateMotion dur="1.8s" begin=".9s" repeatCount="indefinite"><mpath href="#vp2"/></animateMotion></circle><path d="M105,78 C105,110 190,112 222,134 M415,78 C415,110 330,112 298,134" fill="none" stroke="#22304d" stroke-width="2" stroke-dasharray="3 6"/><path d="M260,112 v-16" stroke="#8b9bb4" stroke-width="3" stroke-linecap="round"/><circle class="ant" cx="260" cy="92" r="5" fill="#8b7bff"/><rect x="212" y="112" width="96" height="70" rx="18" fill="#101a2e" stroke="#e6edf3" stroke-width="2.5"/><circle class="eye" cx="240" cy="144" r="8" fill="#22d3ee"/><circle class="eye" cx="280" cy="144" r="8" fill="#22d3ee"/><path d="M244,166 h32" stroke="#8b9bb4" stroke-width="3" stroke-linecap="round"/><rect x="200" y="134" width="12" height="24" rx="4" fill="#5b6b86"/><rect x="308" y="134" width="12" height="24" rx="4" fill="#5b6b86"/><path class="trail" d="M20,214 C120,214 150,200 212,204 S390,222 486,196" fill="none" stroke="#8b7bff" stroke-width="2.5" stroke-dasharray="2 9" stroke-linecap="round"/><path d="M486,196 v-26 l20,8 l-20,8" fill="#22d3ee" stroke="#22d3ee" stroke-width="2" stroke-linejoin="round"/><text x="20" y="196" font-size="11.5" fill="#5b6b86" class="mono">PPO + human feedback</text></g>
</g>
<rect x=".5" y=".5" width="599" height="291" rx="20" fill="none" stroke="#22304d"/>
</svg>

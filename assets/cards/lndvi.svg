le t3" x="404" y="56" width="108" height="108" rx="14" fill="#101a2e" stroke="#22304d" stroke-width="1.5"/><g transform="translate(458,110)"><path d="M0,-34 C24,-22 28,10 0,34 C-28,10 -24,-22 0,-34 Z" fill="url(#ndvi)" stroke="#0b1220" stroke-width="1"/><path d="M0,-28 L0,30" stroke="#0b1220" stroke-opacity=".45" stroke-width="1.5"/></g><text x="458" y="188" font-size="13" fill="#8b9bb4" text-anchor="middle">LNDVI score</text></g></g>

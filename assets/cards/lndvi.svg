<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 292" width="600" height="292" role="img" aria-label="LNDVI">
<title>LNDVI</title>
<defs>
<radialGradient id="glow" cx="82%" cy="18%" r="70%"><stop offset="0" stop-color="#34d399" stop-opacity=".20"/><stop offset="1" stop-color="#34d399" stop-opacity="0"/></radialGradient>
<clipPath id="card"><rect width="600" height="292" rx="20"/></clipPath>
<linearGradient id="ndvi" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#ef4444"/><stop offset=".5" stop-color="#facc15"/><stop offset="1" stop-color="#22c55e"/></linearGradient>
</defs>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
.mono{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}

.lbox{animation:ldraw 6s ease-in-out infinite}
@keyframes ldraw{0%,10%{stroke-dashoffset:304}35%,100%{stroke-dashoffset:0}}
.lmask{animation:lfill 6s ease-in-out infinite}
@keyframes lfill{0%,35%{fill-opacity:0}55%,100%{fill-opacity:.8}}
.ltile{animation:lhi 6s linear infinite}
.t1{animation-delay:1.2s}.t2{animation-delay:2.4s}.t3{animation-delay:3.6s}
@keyframes lhi{0%,22%,100%{stroke:#22304d}6%,16%{stroke:#34d399}}

@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<g clip-path="url(#card)">
<rect width="600" height="292" fill="#0b1220"/>

<rect width="600" height="292" fill="url(#glow)"/>
